services:
  kow-tracker:
    build: .
    container_name: kow_tracker
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DB_PATH=${DB_PATH:-/app/data/kow.db}
